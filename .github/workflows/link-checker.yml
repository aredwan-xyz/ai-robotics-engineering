name: Link Checker

on:
  schedule:
    - cron: "0 0 * * 1" # Run every Monday at midnight
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Link Checker
        uses: lycheeverse/lychee-action@7cd0af4c74a61395d455af97419279d86aafaede # v2.0.2; fixes GHSA-65rg-554r-9j5x
        with:
          args: --accept=200,429,403 --exclude-mail -v "**/*.md"
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
